[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música, running on Cloudflare Python Workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest",
    "pypdf",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
