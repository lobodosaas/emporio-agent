[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música, running on Cloudflare Python Workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest",
    "pypdf",
]
# Only for running locally without Cloudflare with a Claude key (scripts/local_server.py).
# Kept out of [project.dependencies] so it is never bundled into the Worker.
local = [
    "anthropic>=1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
